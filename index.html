    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Muallimun Kur'an, Meal & Araştırma Platformu",

        "operatingSystem": "All",
        "inLanguage": ["tr", "ar", "en"],
        "image": "https://kuran.muallimun.net/icons/icon-512.png",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "TRY"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Inter:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Scheherazade+New:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var raw = localStorage.getItem('muallimun_meal_v1');
          var theme = 'cream';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.settings && parsed.settings.theme) {
              theme = parsed.settings.theme;
            }
          }
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
          var themeColorMap = { light: '#f4f7f7', cream: '#faf6ee', dark: '#0b1314' };
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) {
            metaTheme.setAttribute('content', themeColorMap[theme] || '#faf6ee');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'cream');
          var fallbackMeta = document.querySelector('meta[name="theme-color"]');
          if (fallbackMeta) {
            fallbackMeta.setAttribute('content', '#faf6ee');
          }
        }
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-teal-600/20 selection:text-teal-900 dark:selection:text-teal-100">
